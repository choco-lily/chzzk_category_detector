name: Chzzk Category Monitor

on:
  schedule:
    # 5분마다 실행
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 실행 가능하게 설정

permissions:
  contents: write
  actions: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Detector
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CATEGORY_ID: ${{ vars.CATEGORY_ID || 'DJMAX_RESPECT_V' }}
          VIEWER_THRESHOLD: ${{ vars.VIEWER_THRESHOLD || '1000' }}
          RUN_ONCE: 'true'
        run: node index.js

      - name: Delete old workflow runs
        # 매일 한국 시간 오전 0시(UTC 15:00) 즈음에 실행되는 실행 건에서 로그 정리 수행
        # 여기서는 단순히 gh cli를 사용하여 오래된 로그를 삭제하는 단계를 추가
        if: github.event_name == 'schedule' && (github.event.schedule == '*/10 * * * *' && strategy.job-index == 0)
        continue-on-error: true
        run: |
          # 1일 이상 된 워크플로우 실행 기록 삭제
          gh run delete --all --created "<$(date -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
        env:
          GH_TOKEN: ${{ github.token }}
