name: Chzzk Category Monitor

on:
  schedule:
    # 5분마다 실행
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 실행 가능하게 설정

permissions:
  contents: write
  actions: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Detector (Category)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CATEGORY_ID: ${{ vars.CATEGORY_ID || 'DJMAX_RESPECT_V' }}
          VIEWER_THRESHOLD: ${{ vars.VIEWER_THRESHOLD || '1000' }}
          RUN_ONCE: 'true'
        run: node index.js

      - name: Run Detector (Channel Search)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_ONCE: 'true'
        run: node channel_search.js

      - name: Commit & Push History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add known_channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update discovered channels history" && git push)
        continue-on-error: true

      - name: Delete old workflow runs
        continue-on-error: true
        run: |
          # 1일 이상 된 모든 완료된 워크플로우 실행 기록 삭제
          # gh run list로 대상을 찾고 xargs로 하나씩 삭제합니다.
          gh run list --limit 1000 --created "<$(date --date='1 day ago' +%Y-%m-%d)" --json databaseId --jq '.[].databaseId' | xargs -I {} gh run delete {}
        env:
          GH_TOKEN: ${{ github.token }}

